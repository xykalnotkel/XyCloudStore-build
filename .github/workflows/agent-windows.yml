name: Build Agen Windows (Rust/egui native)

# Pemilik meminta semua build dipicu manual setelah seluruh coding selesai.
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Branch/tag/commit private source"
        required: false
        default: "main"

concurrency:
  group: agent-win-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Bangun agen Rust/egui native jadi .exe (tanpa Tauri/WebView/terminal)
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout private source (read-only deploy key)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: xykalnotkel/XyCloudStore
          ref: ${{ github.event.inputs.source_ref || 'main' }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false
          sparse-checkout: agent-gui
          sparse-checkout-cone-mode: true
          path: source

      - name: Hapus deploy key dari runner setelah checkout
        shell: pwsh
        run: |
          $cmd = git -C source config --local --get core.sshCommand
          if (-not $cmd) { throw 'core.sshCommand checkout tidak ditemukan' }
          $match = [regex]::Match($cmd, '-i\s+"([^"]+)"')
          if (-not $match.Success) { throw 'Lokasi deploy key tidak ditemukan' }
          $key = [System.IO.Path]::GetFullPath($match.Groups[1].Value)
          $temp = [System.IO.Path]::GetFullPath($env:RUNNER_TEMP)
          if (-not $key.StartsWith($temp, [System.StringComparison]::OrdinalIgnoreCase)) {
            throw 'Lokasi deploy key di luar RUNNER_TEMP'
          }
          Remove-Item -LiteralPath $key -Force -ErrorAction SilentlyContinue
          git -C source config --local --unset-all core.sshCommand
          Write-Host 'Deploy key checkout sudah dihapus sebelum toolchain build berjalan.'

      - name: Pasang toolchain Rust (stable-msvc)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Bangun rilis native (cargo build --release)
        shell: pwsh
        working-directory: source/agent-gui/src-native
        run: |
          # Native egui/eframe — tidak perlu tauri-cli, WebView2, maupun dev server.
          cargo build --release --locked
          $exe = Get-Item "target/release/xycloud-agent.exe" -ErrorAction SilentlyContinue
          if (-not $exe) { throw "xycloud-agent.exe tidak ketemu setelah cargo build" }
          Write-Host "EXE:" $exe.FullName $exe.Length
          New-Item -ItemType Directory -Force ../dist | Out-Null
          Copy-Item $exe.FullName ../dist/XyCloudStore-Agent.exe -Force
          Copy-Item ../README.md ../dist/README.md -Force

      - name: Smoke-test versi
        shell: pwsh
        working-directory: source/agent-gui
        run: |
          # Exe rilis memakai windows_subsystem="windows" → pwsh `&` tidak menunggu
          # dan $LASTEXITCODE kosong. Pakai Start-Process -Wait + redirect stdout.
          $p = Start-Process -FilePath .\dist\XyCloudStore-Agent.exe -ArgumentList '--veri' `
            -Wait -PassThru -NoNewWindow -RedirectStandardOutput ..\veri.txt
          Get-Content ..\veri.txt
          if ($p.ExitCode -ne 0) { throw "Smoke-test --veri gagal (exit $($p.ExitCode))" }
          if (-not (Select-String -Path ..\veri.txt -Pattern 'XyCloudStore-Agent 1\.5\.' -Quiet)) {
            throw "Output --veri tidak memuat versi yang diharapkan"
          }
          Compress-Archive -Path dist/XyCloudStore-Agent.exe, dist/README.md `
            -DestinationPath ../XyCloudStore-Agent-Windows.zip -Force
          Get-Item ../XyCloudStore-Agent-Windows.zip | Select-Object Name, Length

      - name: Smoke-test GUI (jendela dibuat & dirender, lalu tutup sendiri)
        shell: pwsh
        working-directory: source/agent-gui
        run: |
          # Menguji jalur yang sebelumnya tak teruji: pembuatan jendela +
          # renderer (glow → fallback wgpu/WARP). Di runner tanpa GPU, glow
          # gagal dan wgpu software yang mengambil alih — persis skenario PC
          # dengan driver GPU tua/RDP.
          $log = "$env:APPDATA\XyCloudStore\Agent\gui.log"
          if (Test-Path $log) { Remove-Item $log -Force }
          $p = Start-Process -FilePath .\dist\XyCloudStore-Agent.exe -ArgumentList '--gui-tes' -PassThru -NoNewWindow
          Wait-Process -Id $p.Id -Timeout 150 -ErrorAction SilentlyContinue
          if (Test-Path $log) { Write-Host '--- gui.log ---'; Get-Content $log -Tail 20 }
          if (-not $p.HasExited) {
            taskkill /PID $p.Id /T /F | Out-Null
            throw 'GUI hang >150 dtk (jendela tidak menutup)'
          }
          if ($p.ExitCode -ne 0) { throw "Smoke-test GUI gagal (exit $($p.ExitCode)) — lihat gui.log di atas" }

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: XyCloudStore-Agent-Windows
          path: source/XyCloudStore-Agent-Windows.zip
          if-no-files-found: error

  release:
    name: Perbarui release Agen Windows
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Unduh artifact build tervalidasi
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: XyCloudStore-Agent-Windows
          path: dist

      # Tag bergerak agent-windows = link unduhan permanen (bukan v* rilis app).
      # Token tulis hanya tersedia di job release; toolchain build pihak ketiga
      # dan checkout source privat berjalan dengan contents:read.
      - name: Publish unduhan tetap (tag agent-windows)
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: agent-windows
          name: XyCloudStore Agent (Windows)
          body: |
            Agen PC Host Windows — build manual dari source commit yang dipilih pemilik.
            **v1.5 native (egui/eframe):** satu exe mandiri tanpa Tauri, tanpa WebView2, tanpa terminal.
            Auto Sunshine (`sunshine --creds`) + wizard pengaturan + autostart Windows.

            **Unduh:** `XyCloudStore-Agent-Windows.zip` → ekstrak → jalankan `XyCloudStore-Agent.exe`

            Alur: Admin → Unit PC → salin kode → tempel di Agent → Setup Engine → Mulai Agen.
          files: dist/XyCloudStore-Agent-Windows.zip
          fail_on_unmatched_files: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
