name: Build Android APK

# Pemilik meminta build satu kali dan hanya setelah izin eksplisit "jalankan build".
on:
  workflow_dispatch:
    inputs:
      mock:
        description: "Pakai data demo (tanpa server)?"
        required: false
        default: "false"
      onesignal_app_id:
        description: "OneSignal App ID"
        required: false
        default: "f4843c35-cc1d-4772-9f70-1c4349397ffb"
      base_url:
        description: "Base URL API XyCloud"
        required: false
        default: "https://api.xycloud.my.id"
      source_ref:
        description: "Branch/tag/commit private source"
        required: false
        default: "main"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.24.5"
  APP_DIR: source/app

jobs:
  build:
    name: Build APK (release)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout private source (read-only deploy key)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: xykalnotkel/XyCloudStore
          ref: ${{ github.event.inputs.source_ref || 'main' }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false
          sparse-checkout: |
            app
            native
            tools
          sparse-checkout-cone-mode: true
          path: source

      - name: Hapus deploy key dari runner setelah checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, shlex, subprocess
          cmd=subprocess.check_output(['git','-C','source','config','--local','--get','core.sshCommand'],text=True).strip()
          parts=shlex.split(cmd)
          if '-i' not in parts: raise SystemExit('Lokasi deploy key tidak ditemukan.')
          key=pathlib.Path(parts[parts.index('-i')+1]).resolve()
          runner=pathlib.Path(__import__('os').environ['RUNNER_TEMP']).resolve()
          if runner not in key.parents: raise SystemExit('Lokasi deploy key di luar RUNNER_TEMP.')
          key.unlink(missing_ok=True)
          subprocess.run(['git','-C','source','config','--local','--unset-all','core.sshCommand'],check=False)
          print('Deploy key checkout sudah dihapus sebelum tool build berjalan.')
          PY

      - name: Validasi sintaks tool build
        run: python3 -m py_compile source/tools/*.py

      - name: Setup Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Info toolchain
        run: |
          flutter --version
          java -version

      - name: Generate platform Android
        working-directory: ${{ env.APP_DIR }}
        run: |
          flutter create . \
            --platforms=android \
            --org id.xycloud \
            --project-name xycloud_order \
            --description "XyCloudStore - Sewa PC Cloud, Beli Akun, CS Realtime"

      - name: Siapkan engine streaming native dalam APK
        run: python3 source/tools/siapkan_streaming.py

      - name: Siapkan updater native (DownloadManager + notif progress)
        working-directory: ${{ env.APP_DIR }}
        run: python3 ../tools/siapkan_pembaruan.py android

      - name: Siapkan mode privasi (FLAG_SECURE anti-screenshot)
        working-directory: ${{ env.APP_DIR }}
        run: python3 ../tools/siapkan_keamanan.py android

      - name: Siapkan login biometrik (MainActivity → FlutterFragmentActivity)
        working-directory: ${{ env.APP_DIR }}
        run: python3 ../tools/siapkan_biometrik.py android

      - name: Siapkan ikon push (override ikon OneSignal dengan logo XyCloudStore)
        working-directory: ${{ env.APP_DIR }}
        run: |
          python3 -m pip install --quiet pillow || python3 -m pip install --user --quiet pillow
          python3 ../tools/siapkan_ikon_push.py --android-dir android
          ls -la android/app/src/main/res/drawable/ic_stat_onesignal_default.png


      - name: Naikkan versi Kotlin (dibutuhkan OneSignal)
        working-directory: ${{ env.APP_DIR }}
        run: |
          for f in android/settings.gradle android/settings.gradle.kts; do
            [ -f "$f" ] || continue
            sed -i -E 's/(org\.jetbrains\.kotlin\.android["\)]?[[:space:]]+version[[:space:]]+")[^"]+"/\12.2.20"/' "$f"
            echo "--- $f"
            cat "$f"
          done
          for f in android/build.gradle android/build.gradle.kts; do
            [ -f "$f" ] && sed -i -E 's/(kotlin-gradle-plugin:)[0-9.]+/\12.2.20/' "$f" || true
          done

      - name: Naikkan minSdk ke 23 (dibutuhkan plugin record_android)
        working-directory: ${{ env.APP_DIR }}
        run: |
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            [ -f "$f" ] || continue
            sed -i -E 's/(minSdk\s*=?\s*)flutter\.minSdkVersion/\123/' "$f"
            echo "--- $f"
            grep -nE "minSdk|compileSdk|targetSdk" "$f"
          done

      - name: Bersihkan berkas bawaan flutter create
        working-directory: ${{ env.APP_DIR }}
        run: rm -f test/widget_test.dart

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      - name: Generate launcher icon
        working-directory: ${{ env.APP_DIR }}
        run: dart run flutter_launcher_icons

      - name: Generate native splash
        working-directory: ${{ env.APP_DIR }}
        run: dart run flutter_native_splash:create

      - name: Set nama aplikasi & izin internet
        working-directory: ${{ env.APP_DIR }}
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          python3 ../tools/patch_manifest.py "$MANIFEST"
          echo "----- manifest -----"
          cat $MANIFEST

      - name: Siapkan keystore rilis
        working-directory: ${{ env.APP_DIR }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for nama in KEYSTORE_BASE64 KEY_ALIAS STORE_PASSWORD KEY_PASSWORD; do
            test -n "${!nama:-}" || { echo "$nama belum tersedia; build rilis ditolak."; exit 1; }
          done
          KS="$(pwd)/android/release-key.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KS"
          chmod 600 "$KS"
          {
            echo "storeFile=$KS"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
          chmod 600 android/key.properties
          python3 ../tools/patch_signing.py android/app
          detail="$(keytool -list -keystore "$KS" -storepass:env STORE_PASSWORD)"
          sed -n '1,5p' <<<"$detail"
          echo "Konfigurasi release signing terpasang."

      - name: Analyze
        working-directory: ${{ env.APP_DIR }}
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        working-directory: ${{ env.APP_DIR }}
        run: flutter test

      - name: Build APK universal
        working-directory: ${{ env.APP_DIR }}
        env:
          BUILD_MOCK: ${{ github.event.inputs.mock || 'false' }}
          BUILD_BASE_URL: ${{ github.event.inputs.base_url || 'https://api.xycloud.my.id' }}
          BUILD_ONESIGNAL_APP_ID: ${{ github.event.inputs.onesignal_app_id || 'f4843c35-cc1d-4772-9f70-1c4349397ffb' }}
        run: |
          flutter build apk --release \
            --dart-define="XY_MOCK=$BUILD_MOCK" \
            --dart-define="XY_BASE_URL=$BUILD_BASE_URL" \
            --dart-define="XY_ONESIGNAL_APP_ID=$BUILD_ONESIGNAL_APP_ID" \
            --dart-define=XY_GOOGLE_SERVER_CLIENT_ID=495336144977-1fu3nv7r35pi2i0t8qu6ng0u695t0veg.apps.googleusercontent.com

      - name: Build APK per-ABI
        working-directory: ${{ env.APP_DIR }}
        env:
          BUILD_MOCK: ${{ github.event.inputs.mock || 'false' }}
          BUILD_BASE_URL: ${{ github.event.inputs.base_url || 'https://api.xycloud.my.id' }}
          BUILD_ONESIGNAL_APP_ID: ${{ github.event.inputs.onesignal_app_id || 'f4843c35-cc1d-4772-9f70-1c4349397ffb' }}
        run: |
          flutter build apk --release --split-per-abi \
            --dart-define="XY_MOCK=$BUILD_MOCK" \
            --dart-define="XY_BASE_URL=$BUILD_BASE_URL" \
            --dart-define="XY_ONESIGNAL_APP_ID=$BUILD_ONESIGNAL_APP_ID" \
            --dart-define=XY_GOOGLE_SERVER_CLIENT_ID=495336144977-1fu3nv7r35pi2i0t8qu6ng0u695t0veg.apps.googleusercontent.com

      - name: Rapikan hasil build
        run: |
          mkdir -p dist
          cp ${{ env.APP_DIR }}/build/app/outputs/flutter-apk/app-release.apk dist/XyCloudStore-universal.apk
          for abi in arm64-v8a armeabi-v7a x86_64; do
            f=${{ env.APP_DIR }}/build/app/outputs/flutter-apk/app-$abi-release.apk
            [ -f "$f" ] && cp "$f" "dist/XyCloudStore-$abi.apk" || true
          done
          ls -lh dist

      - name: Verifikasi tanda tangan APK
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -r | head -n1)
          test -x "$APKSIGNER" || { echo "apksigner tidak ditemukan"; exit 1; }
          for f in dist/*.apk; do
            echo "----- $(basename "$f")"
            detail="$("$APKSIGNER" verify --verbose --print-certs "$f")"
            sed -n '1,8p' <<<"$detail"
          done

      - name: Sertakan corresponding source GPL
        run: |
          # Nama bundle sumber GPLv3 HARUS mengikuti versi aplikasi yang sedang
          # dibangun. Sebelumnya angkanya mati di 2.6.0 sehingga bundle sumber
          # tidak lagi cocok dengan APK yang disebar (kewajiban GPLv3).
          VER=$(grep -m1 '^version:' ${{ env.APP_DIR }}/pubspec.yaml | sed -E 's/^version:[[:space:]]*([^+]+).*/\1/')
          echo "VERSI_APLIKASI=$VER" >> "$GITHUB_ENV"
          echo "Versi aplikasi: $VER"
          python3 source/tools/buat_sumber_streaming.py "dist/XyCloudStore-$VER-source.zip"
          ls -lh dist

      - name: Unggah APK universal (terpisah, 1 APK per artifact)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: XyCloudStore-APK-universal
          path: dist/XyCloudStore-universal.apk
          retention-days: 30
          if-no-files-found: error

      - name: Unggah APK arm64-v8a (1 APK per artifact)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: XyCloudStore-APK-arm64-v8a
          path: dist/XyCloudStore-arm64-v8a.apk
          retention-days: 30
          if-no-files-found: error

      - name: Unggah APK armeabi-v7a (1 APK per artifact)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: XyCloudStore-APK-armeabi-v7a
          path: dist/XyCloudStore-armeabi-v7a.apk
          retention-days: 30
          if-no-files-found: error

      - name: Unggah APK x86_64 (1 APK per artifact)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: XyCloudStore-APK-x86_64
          path: dist/XyCloudStore-x86_64.apk
          retention-days: 30
          if-no-files-found: error

      - name: Unggah Sumber GPL (zip)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: XyCloudStore-APK-Sumber-GPL
          path: dist/XyCloudStore-${{ env.VERSI_APLIKASI }}-source.zip
          retention-days: 30
          if-no-files-found: error

      - name: Ringkasan build
        run: |
          {
            echo "## XyCloudStore - Build selesai"
            echo ""
            echo "| Berkas | Ukuran |"
            echo "|---|---|"
            for f in dist/*.apk; do
              echo "| $(basename $f) | $(du -h $f | cut -f1) |"
            done
            echo ""
            echo "Unduh lewat bagian **Artifacts** di halaman run ini."
          } >> $GITHUB_STEP_SUMMARY

  release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: XyCloudStore-APK-universal
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: XyCloudStore-APK-arm64-v8a
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: XyCloudStore-APK-armeabi-v7a
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: XyCloudStore-APK-x86_64
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: XyCloudStore-APK-Sumber-GPL
          path: dist
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          generate_release_notes: true

      - name: Daftarkan rilis ke server XyCloudStore
        if: success()
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: |
          python3 - <<'PY'
          import glob, json, os, re, urllib.error, urllib.request
          key=os.environ.get('ADMIN_KEY','')
          version=os.environ.get('GITHUB_REF_NAME','')
          if not key: raise SystemExit('ADMIN_KEY belum tersedia; registrasi ditolak.')
          if not re.fullmatch(r'v[0-9A-Za-z._-]{1,39}',version):
              raise SystemExit('Tag versi tidak valid.')
          files=[{'nama':os.path.basename(p),'ukuran':os.path.getsize(p)}
                 for p in sorted(glob.glob('dist/XyCloudStore-*.apk'))]
          if len(files)!=4: raise SystemExit(f'Jumlah APK tidak lengkap: {len(files)}/4')
          req=urllib.request.Request('https://api.xycloud.my.id/api/admin/rilis',
              data=json.dumps({'versi':version,'berkas':files}).encode(),
              headers={'Content-Type':'application/json','x-admin-key':key,
                       'User-Agent':'XyCloudStore-CI/2.0'})
          try:
              with urllib.request.urlopen(req,timeout=25) as response:
                  if response.status not in (200,201): raise RuntimeError(f'HTTP {response.status}')
          except urllib.error.HTTPError as exc:
              raise SystemExit(f'Registrasi rilis gagal: HTTP {exc.code}') from None
          print(f'Rilis {version} terdaftar dengan {len(files)} APK.')
          PY
